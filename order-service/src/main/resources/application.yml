spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fulfill_orders}
    username: ${SPRING_DATASOURCE_USERNAME:fulfill}
    password: ${SPRING_DATASOURCE_PASSWORD:fulfill}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

server:
  port: ${SERVER_PORT:8080}

fulfill:
  cors:
    allowed-origin: ${FULFILL_CORS_ALLOWED_ORIGIN:http://localhost:5173}
  kafka:
    topics:
      order-created: ${ORDER_CREATED_TOPIC:order-created}
