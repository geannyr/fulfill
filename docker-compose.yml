services:
  postgres:
    image: postgres:16-alpine
    container_name: fulfill-postgres
    environment:
      POSTGRES_DB: fulfill_orders
      POSTGRES_USER: fulfill
      POSTGRES_PASSWORD: fulfill
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulfill -d fulfill_orders"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
